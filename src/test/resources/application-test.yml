# 테스트 전용 설정 (spring.profiles.active=test)
# - 운영 DB(POS_DB_URL) 대신 build/ 아래 임시 SQLite 파일을 사용한다.
# - build.gradle 의 test 태스크가 실행 전에 build/test-db 를 삭제하므로 매 실행마다 새 DB에서 시작한다.
# - foreign_keys=true: 테스트에서는 FK 제약을 강제한다 (운영 연결은 SQLite 기본값 OFF).
spring:
  datasource:
    url: jdbc:sqlite:build/test-db/pos-test.db?foreign_keys=true
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1   # SQLite 파일 잠금 충돌 방지

  sql:
    init:
      mode: always           # SQLite 는 Spring 기준 embedded DB가 아니라 명시 필요
      encoding: UTF-8
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/test-data.sql
